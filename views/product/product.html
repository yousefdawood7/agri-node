<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css?family=Megrim|Nunito+Sans:400,900"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="https://emojipedia-us.s3.dualstack.us-west-1.amazonaws.com/thumbs/240/apple/155/ear-of-maize_1f33d.png"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{%PRODUCT_EMOJI%}</text></svg>"
    />
    <link rel="stylesheet" href="/product/styles.css" />
    <title>{%PRODUCT_NAME%} | Agri Node</title>
  </head>

  <body>
    <div class="container">
      <h1>🌽 Node Farm 🥦</h1>

      <figure class="product">
        <div class="product__organic {%IS_PRODUCT_ORGANIC%}">
          <h5>Organic</h5>
        </div>
        <a href="/" class="product__back">
          <span class="emoji-left">👈</span>Back
        </a>
        <div class="product__hero">
          <span class="product__emoji product__emoji--1"
            >{%PRODUCT_EMOJI%}</span
          >
          <span class="product__emoji product__emoji--2"
            >{%PRODUCT_EMOJI%}</span
          >
          <span class="product__emoji product__emoji--3"
            >{%PRODUCT_EMOJI%}</span
          >
          <span class="product__emoji product__emoji--4"
            >{%PRODUCT_EMOJI%}</span
          >
          <span class="product__emoji product__emoji--5"
            >{%PRODUCT_EMOJI%}</span
          >
          <span class="product__emoji product__emoji--6"
            >{%PRODUCT_EMOJI%}</span
          >
          <span class="product__emoji product__emoji--7"
            >{%PRODUCT_EMOJI%}</span
          >
          <span class="product__emoji product__emoji--8"
            >{%PRODUCT_EMOJI%}</span
          >
          <span class="product__emoji product__emoji--9"
            >{%PRODUCT_EMOJI%}</span
          >
        </div>

        <h2 class="product__name">{%PRODUCT_NAME%}</h2>
        <div class="product__details">
          <p><span class="emoji-left">🌍</span> From {%PRODUCT_FROM%}</p>
          <p><span class="emoji-left">❤️</span> {%PRODUCT_NUTRIENTS%}</p>
          <p><span class="emoji-left">📦</span> {%PRODUCT_QUANTITY%}</p>
          <p><span class="emoji-left">🏷</span> {%PRODUCT_PRICE%}€</p>
        </div>

        <a href="#" class="product__link">
          <span class="emoji-left">🛒</span>
          <span>Add to shopping card ({%PRODUCT_PRICE%}€)</span>
        </a>

        <p class="product__description">{%PRODUCT_DESC%}</p>
      </figure>
    </div>
  </body>
</html>
